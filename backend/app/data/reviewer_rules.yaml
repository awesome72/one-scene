# 질문 검수기의 규칙 검사 (LLM 판정 전에 먼저 돈다). 원본: SKILL.md 3장, 8장

# 한 응답의 최대 문장 수 (3장: "길이: 2~3문장")
max_sentences: 3

# 공감·평가 상투어 (8장: "좋은 질문이에요", "멋진 이야기네요", "많이 힘드셨겠어요" 등)
empathy_cliches:
  - 좋은 질문
  - 멋진 이야기
  - 멋진 경험
  - 좋은 이야기
  - 힘드셨겠
  - 힘드셨을 것 같
  - 대단하시
  - 대단하네요
  - 공감이 가
  - 이해가 돼요
  - 정말 인상적

# 요약·의미 부여 신호 (3장 철칙 3, 8장)
summary_markers:
  - 정리하면
  - 요약하면
  - 결국 이건
  - 결국 이 이야기는
  - 에 관한 이야기군요
  - 에 관한 이야기네요

# 두 질문을 잇는 신호 (철칙 1). 물음표가 하나여도 이 말 뒤에 질문이 이어지면 탈락
joined_question_markers:
  - "\\?\\s*(그리고|또는|아니면)"
  # "~했는지, 그리고 ~했어요?"처럼 쉼표 뒤에서 두 번째 질문을 잇는 경우
  - ",\\s*(그리고|또는|아니면)\\s+[^.?!]*\\?$"
