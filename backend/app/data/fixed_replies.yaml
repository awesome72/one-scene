# 질문 생성 대신 보내는 고정 응답. 원본: SKILL.md 9장 정서적 안전

# 사용자가 심한 고통을 드러냈을 때: 글쓰기를 멈추고 지금 상태를 먼저 묻는다
distress: >-
  이 이야기는 여기서 멈춰도 괜찮아요. 글보다 지금의 당신이 먼저예요.
  지금은 좀 어떠세요?

# 이런 말이 들어 있으면 재료 추출(고통 신호 판정)이 끝날 때까지 질문을 화면에 보내지 않는다.
# 그 밖의 답은 속도를 위해 질문을 바로 흘려보내고, 추출이 뒤늦게 고통 신호를 잡으면 질문을 지우고 위 응답으로 바꾼다
distress_markers:
  - 죽고 싶
  - 죽고싶
  - 죽을 것 같
  - 죽어 버리
  - 사라지고 싶
  - 살고 싶지 않
  - 견딜 수가 없
  - 견딜 수 없
  - 버틸 수가 없
  - 감당이 안 돼
  - 감당할 수 없
  - 자해
  - 극단적인 생각
  - 숨이 막혀
  - 너무 괴로워

# 검수를 끝내 통과하지 못했을 때도 사용자에게는 질문 하나는 나가야 한다.
# 이 경우 마지막 시도를 보내되, 그것마저 비어 있으면 이 질문을 보낸다
fallback_question: 방금 하신 말 중에, 조금 더 이야기하고 싶은 장면이 있어요?
