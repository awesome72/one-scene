# 상투어·과장어·감정 명명 사전. 원본: SKILL.md 7장 (+ 2장 강조어, 4-2 감정어, 1장 철칙 5 예시)
#
# 형식 (docs/claude-code-guide.md 9장):
#   pattern   정규식 (Python re). 활용형까지 잡도록 어간 중심으로 쓴다
#   question  사용자에게 보낼 교정 질문 하나. {match}는 찾은 표현으로 채운다
#   label     화면에 보일 종류 이름 (목업 초안 화면의 '상투 표현', '깨달음 상투' 등)
#   source    SKILL.md 원문 표현 (탐지 테스트가 이 표현들을 모두 잡는지 검사한다)
#   examples  패턴이 반드시 잡아야 하는 문장
#
# 질문 원칙: SKILL.md 4-2 "교정 지적은 한 번에 하나씩, 해당 문장을 인용하고 질문으로 한다"

emotion_name:
  - label: 감정 명명
    pattern: "불안했|불안해졌"
    question: "'{match}'라고 쓰셨어요. 그날 손은 뭘 하고 있었어요?"
    source: [나는 불안했다]
    examples: [그날 나는 불안했다., 갑자기 불안해졌다.]
  - label: 감정 명명
    pattern: "허전했|허전해졌"
    question: "'{match}'라고 쓰셨어요. 돌아와서 가장 먼저 한 게 뭐였어요?"
    source: [허전했다]
    examples: [마음이 허전했다.]
  - label: 감정 명명
    pattern: "기뻤|기뻐했"
    question: "'{match}'라고 쓰셨어요. 그 소식을 누구에게 제일 먼저 말했어요?"
    source: [기뻤다]
    examples: [나는 기뻤다.]
  - label: 감정 명명
    pattern: "슬펐|외로웠|설렜|서운했|행복했"
    question: "'{match}'라고 쓰셨어요. 그때 실제로 몸은 무엇을 하고 있었어요?"
    source: [슬펐다, 외로웠다, 설렜다, 서운했어요, 행복했다]
    examples: [그날 나는 행복했다., 조금 서운했지만 웃었다., 외로웠던 밤]

cliche:
  # 감정 상투
  - label: 상투 표현
    pattern: "가슴이 (먹먹|뭉클)"
    question: "'{match}'라고 쓰셨어요. 그때 몸은 실제로 무엇을 하고 있었어요?"
    source: [가슴이 먹먹했다, 가슴이 뭉클했다]
    examples: [가슴이 먹먹했다., 가슴이 뭉클해졌다.]
  - label: 상투 표현
    pattern: "눈물이 앞을 가렸|하늘이 무너지는 것 같|머리가 하얘|만감이 교차"
    question: "'{match}'라고 쓰셨어요. 그 순간 눈에 들어온 게 뭐였어요?"
    source: [눈물이 앞을 가렸다, 하늘이 무너지는 것 같았다, 머리가 하얘졌다, 만감이 교차했다]
    examples: [하늘이 무너지는 것 같았다., 머리가 하얘졌다.]
  # 시간 상투
  - label: 시간 상투
    pattern: "시간이 쏜살같이|어느덧|눈 깜짝할 사이|그로부터 몇 년 (후|뒤)"
    question: "'{match}'라고 쓰셨어요. 그 시간 동안 달라진 물건이나 습관이 있어요?"
    source: [시간이 쏜살같이 흘렀다, 어느덧, 눈 깜짝할 사이에, 그로부터 몇 년 후]
    examples: [어느덧 십 년이 지났다., 그로부터 몇 년 뒤]
  # 깨달음 상투
  - label: 깨달음 상투
    pattern: "그때는 몰랐다|이제야 알 것 같|소중한 깨달음|인생의 전환점|한 뼘 (더 )?성장|모든 것이 달라졌"
    question: "'{match}'라고 쓰셨어요. 그 일 이후로 실제로 달라진 행동 하나만 말해주실래요?"
    source: [그때는 몰랐다, 이제야 알 것 같다, 소중한 깨달음, 인생의 전환점, 한 뼘 성장했다, 모든 것이 달라졌다]
    examples: ["그때는 몰랐다, 그 회의가 마지막이 될 줄.", 한 뼘 더 성장했다.]
  # 마무리 상투
  - label: 마무리 상투
    pattern: "앞으로도 .{0,30}살아가고 싶|소중함을 다시 한 ?번 느꼈|결국 중요한 (건|것은) "
    question: "'{match}'라고 쓰셨어요. 처음 장면의 그 사물을 지금 다시 본다면, 어디서 어떤 모습이에요?"
    source: [앞으로도 ~하며 살아가고 싶다, ~의 소중함을 다시 한번 느꼈다, 결국 중요한 건 ~이다]
    examples: [앞으로도 천천히 걸으며 살아가고 싶다., 가족의 소중함을 다시 한 번 느꼈다.]

exaggeration:
  - label: 과장
    pattern: "너무너무|정말 엄청|세상에서 가장|평생 잊지 못할|단 한 번도|완전히|진심으로"
    question: "'{match}' 대신 그 장면의 디테일 하나를 넣는다면 뭐가 좋을까요?"
    source: [너무너무, 정말 엄청, 세상에서 가장, 평생 잊지 못할, 단 한 번도, 완전히, 진심으로]
    examples: [세상에서 가장 긴 하루였다., 평생 잊지 못할 순간]
  - label: 과장
    # '모든 것이 달라졌다'는 깨달음 상투가 먼저 잡는다
    pattern: "(?<![가-힣])모든(?! 것이 달라졌)"
    question: "'{match}'이라고 쓰셨어요. 그중 하나만 고른다면 무엇이에요?"
    source: [모든]
    examples: [모든 사람이 웃었다.]
  # SKILL.md 2장: 말을 글로 옮길 때 "진짜", "완전", "너무" 같은 강조어는 삭제하고 디테일로 대체
  - label: 과장
    pattern: "(?<![가-힣])(너무|진짜|완전)(?=\\s)"
    question: "'{match}'를 빼고, 그 정도가 보이는 장면 하나를 넣는다면 뭐가 좋을까요?"
    source: [진짜, 완전, 너무]
    examples: [나는 너무 지쳐 있었다., 진짜 아무 말도 안 했다.]
