# 평가용 golden 시나리오 10개 (docs/claude-code-guide.md 12장 Phase 8).
# 사용자 답은 미리 정해 둔 것이라 코치 질문과 꼭 맞물리지 않는다. 평가하는 것은
# "코치가 사용자의 마지막 말을 이어받아 좋은 질문 하나를 하는가"와 "재료를 원문대로 잘 뽑는가"다.
#
# 각 시나리오가 일부러 담은 것 (tags):
#   dialogue  따옴표 대사 (F1: 대사 재료 추출)
#   emotion   감정 이름 ("서운했어요")
#   repeat    같은 말 반복
#   hesitate  머뭇거림·말 고침
#   skip      넘어가자는 요청
#   oral      입말 군더더기

- id: quit
  name: 퇴사
  tags: [dialogue, repeat]
  opening_question: 그만두기로 마음먹은 그 순간, 어디에 있었어요?
  answers:
    - 회의실이었어요. 팀장님이 또 같은 얘기를 하는데, 아 이건 아니다 싶었어요. 창밖만 보고 있었어요.
    - '"이번 분기만 버티자." 그 말을 3년 동안 들었어요. 처음 들은 건 입사 첫 해 겨울 워크숍이었어요.'
    - 창밖에는 주차장이 있었어요. 제 차가 보였어요. 그냥 저 차 타고 집에 가고 싶다, 그 생각만 했어요.
    - 사직서는 그 주 금요일에 냈어요. 팀장님은 "생각 좀 더 해 봐"라고만 하셨어요.

- id: moving
  name: 이사
  tags: [repeat, oral]
  opening_question: 최근, 별일 아닌데 자꾸 생각나는 순간이 있어요?
  answers:
    - 어 그니까 지난달에 이사를 했는데요, 짐을 다 빼고 나서 빈 방을 한 번 더 봤거든요. 벽에 액자 걸었던 자국이 있었어요.
    - 액자 자국이 네모나게 하얗게 남아 있었어요. 거기만 하얗고 나머지는 누렇게 바래 있었어요. 8년을 살았거든요.
    - 그 액자는 결혼사진이었어요. 이혼하고 나서 떼어 냈는데 자국은 그대로였던 거죠. 8년 동안 그 자국 앞을 지나다녔어요.
    - 마지막에 불 끄고 나올 때 그 자국을 손으로 한 번 쓸어 봤어요. 왜 그랬는지는 모르겠어요.

- id: father
  name: 아버지의 시계
  tags: [hesitate]
  opening_question: 버리지 못하고 아직 갖고 있는 물건이 있어요?
  answers:
    - 아버지가 차시던 손목시계요. 서랍 맨 안쪽에 신문지에 싸여 있었어요. 시계는 3시 17분에 멈춰 있었어요.
    - 그게... 뭐랄까, 아버지 돌아가신 날이 새벽이었는데, 시간이 그때였는지는 사실 모르겠어요. 그냥 그렇게 믿고 싶었던 것 같기도 하고요.
    - 아버지는 그 시계를 밥 먹을 때도 안 푸셨어요. 손목에 시곗줄 자국이 하얗게 나 있었어요.
    - 지금은 제 책상 위에 둬요. 건전지를 갈면 갈 텐데, 아직 안 갈았어요.

- id: first_salary
  name: 첫 월급
  tags: [dialogue, emotion]
  opening_question: 처음으로 무언가를 했던 날 중에 가장 먼저 떠오르는 게 뭐예요?
  answers:
    - 첫 월급 받은 날이요. 엄마한테 빨간 내복을 사 드렸어요. 촌스럽다고 웃으셨어요.
    - '엄마가 "이런 걸 요즘 누가 사냐"면서도 그 자리에서 입어 보셨어요. 그날 너무 뿌듯했어요.'
    - 월급이 162만 원이었어요. 내복은 3만 9천 원이었고요. 남은 돈은 거의 다 자취방 월세로 나갔어요.
    - 엄마는 그 내복을 아직도 겨울마다 입으세요. 지난 설에 갔을 때도 입고 계셨어요.

- id: friend
  name: 연락이 끊긴 친구
  tags: [emotion, skip]
  opening_question: 요즘 누군가에게 말하려다 만 이야기가 있어요?
  answers:
    - 고등학교 때 제일 친했던 친구한테 연락하려다 말았어요. 카톡 프로필에 아기 사진이 올라와 있더라고요.
    - 우리가 마지막으로 만난 게 7년 전 그 친구 결혼식이었어요. 제가 축사를 했는데, 좀 서운했어요. 제 얘기를 별로 안 들어 주는 것 같아서요.
    - 그 결혼식 얘기는 좀 넘어갈게요.
    - 고등학교 때는 매일 같이 버스를 탔어요. 마을버스 맨 뒷자리요. 이어폰 한쪽씩 나눠 꼈어요.

- id: hospital
  name: 병원 대기실
  tags: [repeat, hesitate]
  opening_question: 그때 내가 다르게 했더라면, 하고 떠오르는 장면이 있어요?
  answers:
    - 엄마 검사 결과 들으러 같이 갔던 날이요. 대기실에서 번호표를 계속 만지작거렸어요. 214번이었어요.
    - 전광판에 번호가 하나씩 넘어가는데, 213번에서 한참 안 넘어갔어요. 한참을요. 엄마는 계속 괜찮다고만 하셨어요.
    - 의사 선생님 말은 사실 잘 기억이 안 나요. 그... 모니터에 사진 같은 걸 보여 주셨던 것만 기억나요.
    - 돌아오는 길에 엄마가 칼국수 먹자고 하셨어요. 저는 한 젓가락도 못 먹었는데 엄마는 다 드셨어요.

- id: first_home
  name: 처음 혼자 살던 집
  tags: [oral]
  opening_question: 처음으로 무언가를 했던 날 중에 가장 먼저 떠오르는 게 뭐예요?
  answers:
    - 처음 혼자 살던 반지하 원룸이요. 창문이 길이랑 높이가 같아서 사람들 발목만 보였어요.
    - 비 오는 날엔 창문으로 우산 끝이랑 장화만 지나갔어요. 진짜 완전 신기했어요. 하루 종일 발만 봤어요.
    - 첫날 밤엔 이불도 없어서 패딩 덮고 잤어요. 바닥이 차가워서 잠을 거의 못 잤어요.
    - 지금 사는 집은 7층이에요. 가끔 일부러 1층 카페 창가에 앉아서 지나가는 발을 봐요.

- id: exam
  name: 떨어진 시험
  tags: [emotion, dialogue]
  opening_question: 누군가 한 말 중에 아직도 그대로 기억나는 문장이 있어요?
  answers:
    - '세 번째 임용 시험 떨어졌을 때 아빠가 "밥은 먹었냐"고만 물어보셨어요. 그 말이 아직도 기억나요.'
    - 발표는 오전 10시였어요. 독서실 화장실에서 휴대폰으로 확인했어요. 수험번호를 세 번 다시 쳐 봤어요.
    - 너무 슬펐어요. 그날 집에 가는 버스에서 창문에 머리를 계속 기대고 있었어요.
    - 집에 오니까 아빠가 김치찌개를 끓여 놓으셨어요. 아빠는 요리를 안 하시는 분이거든요.

- id: dog
  name: 반려견
  tags: [repeat]
  opening_question: 버리지 못하고 아직 갖고 있는 물건이 있어요?
  answers:
    - 우리 강아지 콩이 목줄이요. 현관 신발장 옆 고리에 아직 걸려 있어요.
    - 콩이는 목줄 걸린 소리만 나면 현관으로 뛰어왔어요. 짤랑 하는 소리요. 그 소리만 나면 꼬리를 흔들었어요.
    - 작년 봄에 열네 살로 갔어요. 마지막 몇 달은 산책을 못 해서 목줄을 쓸 일이 없었어요.
    - 지금도 외출할 때 그 고리를 보면 손이 한 번 멈춰요. 짤랑 소리가 날까 봐요.

- id: grandma
  name: 할머니의 부엌
  tags: [dialogue, oral]
  opening_question: 그 이야기를 떠올리면 가장 먼저 보이는 장면이 뭐예요?
  answers:
    - 할머니 부엌이요. 시골집 부엌인데 아궁이가 있었어요. 할머니는 늘 쪼그려 앉아서 불을 보셨어요.
    - '제가 옆에 앉으면 "연기 들어간다, 저리 가" 하시면서도 고구마를 하나 넣어 주셨어요.'
    - 고구마가 다 익으면 부지깽이로 꺼내서 신문지에 굴리셨어요. 손이 새까매졌어요. 할머니 손도 제 손도요.
    - 그 집은 지금 헐리고 없어요. 작년에 가 봤는데 아궁이 있던 자리에 주차장이 생겼더라고요.
