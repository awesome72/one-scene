# 출처: SKILL.md 10장 대화 예시. 코치 응답은 모두 검수를 통과해야 하고, bad는 탈락해야 한다.
name: 회사를 그만둔 날
turns:
  - role: user
    text: 회사 그만둔 얘기를 쓰고 싶어요.
  - role: coach
    text: 그만둔 이야기요. 그만두기로 마음먹은 그 순간, 어디에 있었어요?
  - role: user
    text: 회의실이었어요. 팀장님이 또 같은 얘기를 하는데, 갑자기 아 이건 아니다 싶었어요. 창밖만 보고 있었어요.
  - role: coach
    text: "\"또 같은 얘기\"라고 하셨어요. 그날 팀장님이 한 그 얘기, 기억나는 문장이 있어요?"
  - role: user
    text: "\"이번 분기만 버티자.\" 그 말을 3년 동안 들었어요."
  - role: coach
    # 원문은 "그 말을 처음 들었던 날은 어땠어요? 그때도 창밖을 봤어요?"로 물음표가 둘이고,
    # 발표 자료의 "…날도 창밖을 봤어요?"는 예/아니오 질문이다 (3장 품질 기준 3). open-questions E1.
    # 같은 의도(3년, 반복 이미지 '창밖', 처음 vs 마지막)를 장면 질문 하나로 쓴다
    text: 3년 동안 같은 문장이요. 그 말을 처음 들었던 날, 창밖에는 무엇이 보였어요?
bad:
  - after_user: 회사 그만둔 얘기를 쓰고 싶어요.
    text: 회사를 그만두는 건 큰 결정이었겠네요. 그때 어떤 감정이었고, 어떤 계기가 있었나요? 그리고 지금은 어떻게 생각하세요?
    why: 공감 상투어, 질문 세 개, 감정을 추상으로 물음 (SKILL.md 10장)
